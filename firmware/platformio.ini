; UlumiGlow - firmware ESP32-C3
; La plataforma queda fija en la serie 6.x (Arduino core 2.0.x), que es la
; que tiene ledcSetup()/ledcAttachPin(). El core 3.x cambio esa API.

[env:esp32c3]
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = direct

; USB nativo del C3 como puerto serie (sin chip CH340/CP210x)
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
